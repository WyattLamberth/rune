[package]
name = "rune-oci"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A safe Rust OCI runtime with a deterministic lifecycle core"

[[bin]]
name = "rune"
path = "src/main.rs"

[workspace]
members = ["crates/rune-core"]
resolver = "3"
exclude = ["vendor/libcontainer"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libcontainer = "=0.7.0"
liboci-cli = "=0.7.0"
oci-spec = "=0.10.0"
serde_ignored = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
serde_json = "1"
serde = "1"
rune-core = { path = "crates/rune-core" }
nix = { version = "0.29", features = ["user", "fs"] }

[dev-dependencies]
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[patch.crates-io]
libcontainer = { path = "vendor/libcontainer" }
