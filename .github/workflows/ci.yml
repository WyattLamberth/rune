name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - run: python3 -m unittest discover -s scripts -p test_smoke_cleanup.py
      - run: python3 scripts/check-architecture.py
      - run: python3 scripts/parity-inventory.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: rustc --edition 2024 --test vendor/libcontainer/src/rootfs/selinux.rs -o /tmp/rune-label-tests && /tmp/rune-label-tests
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - run: nix flake check --print-build-logs
